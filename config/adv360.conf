# The custom resolver emits short multi-key sequences for Windows Alt codes.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=128

# Preserve short bursts from either matrix before they reach the split/HID path.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=32

# The pinned Kinesis fork overrides ZMK's usual 5 ms debounce with 15 ms.
# Match the source Advantage 2's DEBOUNCE=5 budget: short press/release
# transitions must reach the resolver rather than disappear before it.
# This is switch debouncing, not the unchanged 90/170 ms gesture timing.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
