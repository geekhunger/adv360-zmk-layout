on: [push, pull_request, workflow_dispatch]

name: Build (right Ctrl)

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build (Legacy)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version data
        id: get_info
        run: |
          timestamp=$(date +"%Y%m%d%H%M")
          commit=$(echo "${{ github.sha }}" | cut -c1-7)
          file_prefix=$timestamp-$commit
          branch_name=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}' | cut -c1-4)
          echo "file_prefix=$file_prefix" >> $GITHUB_OUTPUT
          bin/get_version.sh $branch_name $commit
      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: West Init
        run: west init -l config
      - name: West Update
        run: west update
      - name: Resolver state and ordering regressions
        run: |
          CC=gcc ZMK_DIR="${GITHUB_WORKSPACE}/zmk" sh tests/native/run.sh
          CC=gcc ZMK_DIR="${GITHUB_WORKSPACE}/zmk" TEST_REVERSE_LISTENERS=1 sh tests/native/run.sh
          CC=gcc ZMK_DIR="${GITHUB_WORKSPACE}/zmk" TEST_TRACE_HOOKS=1 sh tests/native/run.sh
      - name: Bluetooth OS profile persistence and unchanged input gates
        run: |
          CC=gcc sh tests/native/run_profile_os.sh
          python3 tests/native/check_profile_os_scope.py
      - name: Matrix debounce regressions
        run: CC=gcc ZMK_DIR="${GITHUB_WORKSPACE}/zmk" sh tests/native/run_debounce.sh
      - name: Apply split and USB transport patches
        run: |
          git -C zmk restore --source=HEAD --worktree -- app/src/physical_layouts.c app/src/split/bluetooth/central.c app/src/split/bluetooth/service.c app/src/usb_hid.c app/src/usb.c app/include/zmk/usb_hid.h
          for patch_name in zmk-split-notify-backpressure zmk-usb-hid-stable-buffer; do
            patch_file="${GITHUB_WORKSPACE}/patches/${patch_name}.patch"
            git -C zmk apply --check "$patch_file"
            git -C zmk apply "$patch_file"
          done
      - name: USB report ownership regressions
        run: CC=gcc ZMK_DIR="${GITHUB_WORKSPACE}/zmk" sh tests/native/run_usb.sh
      - name: Scoped trace privacy and bounds regressions
        run: |
          CC=gcc sh tests/native/run_trace.sh
          python3 tools/adv360_trace_collector.py --self-test
      - name: Apply diagnostic hooks
        run: |
          git -C zmk apply --check "${GITHUB_WORKSPACE}/patches/zmk-scoped-timing-trace.patch"
          git -C zmk apply "${GITHUB_WORKSPACE}/patches/zmk-scoped-timing-trace.patch"
      - name: West Zephyr export
        run: west zephyr-export
      - name: West Build (left)
        run: west build -s zmk/app -d build/left -b adv360_left -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/diagnostic-config/scoped-trace.conf" -DEXTRA_DTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/diagnostic-config/scoped-trace.overlay"
      - name: Verify linked resolver event order
        run: |
          nm_tool=$(sed -n 's/^CMAKE_NM:FILEPATH=//p' build/left/CMakeCache.txt)
          sh tests/native/check_firmware_symbols.sh build/left/zephyr/zmk.elf "$nm_tool"
          "$nm_tool" build/left/zephyr/zmk.elf | grep -q ' zmk_listener_adv360_profile_os$'
          grep -qx 'CONFIG_ADV360_PROFILE_OS=y' build/left/zephyr/.config
          "$nm_tool" build/left/zephyr/zmk.elf | grep -q ' profile_os_stack$'
          python3 tests/native/check_num_media.py --compiled build/left/zephyr/zephyr.dts --dtlib-source zephyr/scripts/dts/python-devicetree/src
      - name: Adv360 Left Kconfig file
        run: grep -vE '(^#|^$)' build/left/zephyr/.config
      - name: West Build (right)
        run: west build -s zmk/app -d build/right -b adv360_right -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/diagnostic-config/scoped-trace.conf" -DEXTRA_DTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/diagnostic-config/scoped-trace.overlay"
      - name: Adv360 Right Kconfig file
        run: grep -vE '(^#|^$)' build/right/zephyr/.config
      - name: Verify profile memory is central-only
        run: |
          if grep -qx 'CONFIG_ADV360_PROFILE_OS=y' build/right/zephyr/.config; then exit 1; fi
      - name: Verify compiled matrix debounce
        run: |
          for half in left right; do
            grep -qx 'CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5' build/$half/zephyr/.config
            grep -qx 'CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5' build/$half/zephyr/.config
          done
      - name: Verify finite diagnostic recorder is linked on both halves
        run: |
          for half in left right; do
            for setting in CONFIG_ADV360_SCOPED_TRACE=y CONFIG_USB_CDC_ACM=y '# CONFIG_LOG is not set' '# CONFIG_CONSOLE is not set'; do
              grep -qx "$setting" build/$half/zephyr/.config
            done
            nm_tool=$(sed -n 's/^CMAKE_NM:FILEPATH=//p' build/$half/CMakeCache.txt)
            "$nm_tool" build/$half/zephyr/zmk.elf | grep -q ' adv360_trace_position$'
          done
      - name: Rename zmk.uf2
        run: cp build/left/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-left.uf2 && cp build/right/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-right.uf2
      - name: Archive (Adv360)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-right-control
          path: |
            ${{ steps.get_info.outputs.file_prefix }}-left.uf2
            ${{ steps.get_info.outputs.file_prefix }}-right.uf2
  build-clique:
    if: false
    runs-on: ubuntu-22.04
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build (Clique)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version data
        id: get_info
        run: |
          timestamp=$(date +"%Y%m%d%H%M")
          commit=$(echo "${{ github.sha }}" | cut -c1-7)
          file_prefix=$timestamp-$commit
          branch_name=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}' | cut -c1-4)
          echo "file_prefix=$file_prefix" >> $GITHUB_OUTPUT
          bin/get_version.sh $branch_name $commit clique
      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: West Init
        run: west init -l config
      - name: West Update
        run: west update
      - name: Apply split and USB transport patches
        run: |
          git -C zmk restore --source=HEAD --worktree -- app/src/physical_layouts.c app/src/split/bluetooth/central.c app/src/split/bluetooth/service.c app/src/usb_hid.c app/src/usb.c app/include/zmk/usb_hid.h
          for patch_name in zmk-split-notify-backpressure zmk-usb-hid-stable-buffer; do
            patch_file="${GITHUB_WORKSPACE}/patches/${patch_name}.patch"
            git -C zmk apply --check "$patch_file"
            git -C zmk apply "$patch_file"
          done
      - name: USB report ownership regressions
        run: CC=gcc ZMK_DIR="${GITHUB_WORKSPACE}/zmk" sh tests/native/run_usb.sh
      - name: West Zephyr export
        run: west zephyr-export
      - name: West Build (left)
        run: west build -s zmk/app -d build/left -b adv360_left -S studio-rpc-usb-uart -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" -DCONFIG_ZMK_STUDIO=y
      - name: Verify linked resolver event order
        run: |
          nm_tool=$(sed -n 's/^CMAKE_NM:FILEPATH=//p' build/left/CMakeCache.txt)
          sh tests/native/check_firmware_symbols.sh build/left/zephyr/zmk.elf "$nm_tool"
          python3 tests/native/check_num_media.py --compiled build/left/zephyr/zephyr.dts --dtlib-source zephyr/scripts/dts/python-devicetree/src
      - name: Adv360 Left Kconfig file
        run: grep -vE '(^#|^$)' build/left/zephyr/.config
      - name: West Build (right)
        run: west build -s zmk/app -d build/right -b adv360_right -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}"
      - name: Adv360 Right Kconfig file
        run: grep -vE '(^#|^$)' build/right/zephyr/.config
      - name: Verify compiled matrix debounce
        run: |
          for half in left right; do
            grep -qx 'CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5' build/$half/zephyr/.config
            grep -qx 'CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5' build/$half/zephyr/.config
          done
      - name: Rename zmk.uf2
        run: cp build/left/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-left.uf2 && cp build/right/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-right.uf2
      - name: Archive (Adv360)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-clique
          path: |
            ${{ steps.get_info.outputs.file_prefix }}-left.uf2
            ${{ steps.get_info.outputs.file_prefix }}-right.uf2
